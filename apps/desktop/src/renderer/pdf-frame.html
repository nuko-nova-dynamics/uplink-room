<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDF</title>
    <style>
      :root {
        --ground: #121315;
        --raised: #18191c;
        --line: #26282c;
        --text: #ebecee;
        --muted: #8f939b;
        --select: #9db0d8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--ground);
        color: var(--muted);
        font:
          13px/1.4 "Atkinson Hyperlegible Next",
          sans-serif;
      }
      body {
        overflow: auto;
      }
      #pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 30px 18px 40px;
      }
      .page + .page {
        margin-top: 12px;
      }
      .page {
        position: relative;
        background: #fff;
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.25),
          0 8px 24px -12px rgb(0 0 0 / 0.5);
      }
      .page canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .page-label {
        position: absolute;
        left: -1px;
        top: -17px;
        font-size: 13px;
        color: var(--muted);
      }
      body.placing .page {
        cursor: crosshair;
      }
      .pin {
        position: absolute;
        transform: translate(-50%, -100%);
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 11px 11px 11px 3px;
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--text);
        font:
          700 13px/20px "Atkinson Hyperlegible Next",
          sans-serif;
        text-align: center;
        cursor: pointer;
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.35);
      }
      .pin.selected {
        background: var(--text);
        color: var(--ground);
        border-color: var(--text);
      }
      .pin.draft {
        border-style: dashed;
      }
      #status {
        padding: 40px 18px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="status">Opening the PDF…</div>
    <div id="pages"></div>
    <script type="module" src="./pdf-frame.ts"></script>
  </body>
</html>
