<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared browser</title>
    <style>
      html,
      body,
      #browser {
        height: 100%;
        margin: 0;
        background: #0b0c0d;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Served only at uplink-frame://browser/ (see src/main/browserFrame.ts), never from the app's
      origin: Hyperbeam's SDK runs code it downloads at runtime, so it gets an origin that holds
      nothing of ours (spec #7, ADR 0006).
    -->
    <div id="browser"></div>
    <script type="module" src="./browser-frame.ts"></script>
  </body>
</html>
