\* expect: ok
\* The queue as built: a start that throws is marked stuck, and the tasks behind it still start, one at a time, within the slots. Once every task has started or is stuck, nothing is left to do, so that end is no deadlock.
CONSTANTS Slots = 1  Inline = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK SlotsRespected StartsOnce NeedsClosedFirst
PROPERTY Progress
CHECK_DEADLOCK FALSE
