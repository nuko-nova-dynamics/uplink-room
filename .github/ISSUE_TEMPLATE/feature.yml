name: Feature request
description: Suggest a change in how Uplink Room works.
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention any ADR in docs/adr/ it touches.
