name: Bug report
description: Something in Uplink Room doesn't work as it should.
labels: ["needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Inbox
        2. Allow a waiting command
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, Updates shows it.
      placeholder: "0.2.27"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Remove tokens, keys and anything private before you paste.
